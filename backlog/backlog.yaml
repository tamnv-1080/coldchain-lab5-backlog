# Nguồn duy nhất của backlog LAB-5. Script scripts/push-backlog-to-github-project.py đọc file này để tạo issue.
# Quy ước:
#   key      mã cục bộ ổn định (E09-04b) — ghi vào tiêu đề issue để tra ngược
#   role     người phụ trách giả định (field "Phụ trách (giả định)" trên Project)
#   spec     tài liệu LAB-4 (đường dẫn trong bộ specs/ đã nộp ở LAB-4)
#   scope    việc phải làm · ac: điều kiện nghiệm thu · deps: key phải xong trước
#   subs     sub-issue; khi có subs, issue cha chỉ là vỏ gom (SWP cha = tổng con)
#   constraint: driving-2024  → hạng mục chịu ràng buộc giờ lái xe tải từ 2024
meta:
  product: Product B — hệ thống nghiệp vụ chuỗi kho lạnh thực phẩm
  source: Bộ thiết kế LAB-4 (specs/, nộp 2026-11-21)
  roles:
  - BE-1
  - BE-2
  - FE-1
  - FE-2
  - QA-1
  - BrSE
